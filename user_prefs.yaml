weatherPrefs:
    # Set to False to disable weather.
    enabled: True

    # Time after which the weather data should be refreshed
    refreshInterval: 10

    location:
        latitude: "65.077739"
        longitude: "-21.418135"

    # To obtain an API key, sign up at
    # ------------------------------
    # https://pirateweather.net/
    # ------------------------------
    apiKey: "your_api_key"

    # The units to use for various measurements.  Options include:
    # ca: SI, with Wind Speed and Wind Gust in kilometers per hour.
    # uk: SI, with Wind Speed and Wind Gust in miles per hour and visibility are in miles.
    # us: Imperial units
    # si: SI units
    # Taken from https://docs.pirateweather.net/en/latest/API/
    units: "si"

    # Pirate weather does not support multiple languages yet.
    # As a hack, the UI can use the icon label to set weather description.
    # This isn't perfect but should do while we wait for PirateWeather to
    # support other languages.
    # Uncomment the 'weatherTranslations' block to add your own weather
    # translation

    # weatherTranslations:
    #     clear-day: "Soleggiato"
    #     clear-night: "Notturno sereno"
    #     rain: "Pioggia"
    #     snow: "Neve"
    #     sleet: "Lieve nebbia con pioggia"
    #     wind: "Vento"
    #     fog: "Nebbia"
    #     cloudy: "Nuvoloso"
    #     partly-cloudy-day: "Parcialmente nuvoloso"
    #     partly-cloudy-night: "Parcialmente nuvoloso"
    #     thunderstorm: "Temporale"
    #     hail: "Grandine"

viewPrefs:
    # Set to False to use 12hr clock
    use24HrClock: False

    # Set to False to hide seconds
    showSeconds: True

    # Set to False to remove lights toggle
    showLightsToggle: True

    # Update to whatever language you prefer. Will be displayed as is.
    # Order is important
    days:
        - Sun
        - Mon
        - Tue
        - Wed
        - Thu
        - Fri
        - Sat

    # Update to whatever language you prefer. Will be displayed as is.
    # Order is important
    months:
        - Jan
        - Feb
        - Mar
        - Apr
        - May
        - Jun
        - Jul
        - Aug
        - Sep
        - Oct
        - Nov
        - Dec

    # Set to False to disable hiding cursor using CSS {cursor: none;}
    #   This is a workaround for the fact that the Raspbian's labwc does not
    #   have an easy way to hide the cursor. Setting this to True will
    #   hide the cursor while it is on the webpage.
    cssHideCursor: True
