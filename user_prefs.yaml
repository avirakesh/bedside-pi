weatherPrefs:
    # Set to False to disable weather.
    enabled: True

    # Time after which the weather data should be refreshed
    refreshInterval: 10

    location:
        latitude: "65.077739"
        longitude: "-21.418135"

    # To obtain an API key, sign up at
    # ------------------------------
    # https://pirateweather.net/
    # ------------------------------
    apiKey: "your_api_key"

    # The units to use for various measurements.  Options include:
    #  ca: SI, with Wind Speed and Wind Gust in kilometers per hour.
    #  uk: SI, with Wind Speed and Wind Gust in miles per hour and visibility are in miles.
    #  us: Imperial units
    #  si: SI units
    # Taken from https://docs.pirateweather.net/en/latest/API/
    units: "si"

    # The language to use for weather summary. Options include:
    #  ar: Arabic
    #  az: Azerbaijani
    #  be: Belarusian
    #  bg: Bulgarian
    #  bn: Bengali
    #  bs: Bosnian
    #  ca: Catalan
    #  cs: Czech
    #  cy: Welsh
    #  da: Danish
    #  de: German
    #  el: Greek
    #  en: English (which is the default)
    #  eo: Esperanto
    #  es: Spanish
    #  et: Estonian
    #  fa: Persian
    #  fi: Finnish
    #  fr: French
    #  ga: Irish
    #  gd: Gaelic
    #  he: Hebrew
    #  hi: Hindi
    #  hr: Croatian
    #  hu: Hungarian
    #  id: Indonesian
    #  is: Icelandic
    #  it: Italian
    #  ja: Japanese
    #  ka: Georgian
    #  kn: Kannada
    #  ko: Korean
    #  kw: Cornish
    #  lv: Latvian
    #  ml: Malayam
    #  mr: Marathi
    #  nl: Dutch
    #  no: Norwegian Bokmål
    #  pa: Punjabi
    #  pl: Polish
    #  pt: Portuguese
    #  ro: Romanian
    #  ru: Russian
    #  sk: Slovak
    #  sl: Slovenian
    #  sr: Serbian
    #  sv: Swedish
    #  ta: Tamil
    #  te: Telugu
    #  tet: Tetum
    #  tr: Turkish
    #  uk: Ukrainian
    #  ur: Urdu
    #  vi: Vietnamese
    #  x-pig-latin: Igpay Atinlay
    #  zh: simplified Chinese
    #  zh-tw: traditional Chinese
    # Taken from https://docs.pirateweather.net/en/latest/API/
    language: "en"


viewPrefs:
    # Set to False to use 12hr clock
    use24HrClock: False

    # Set to False to hide seconds
    showSeconds: True

    # Set to False to remove lights toggle
    showLightsToggle: True

    # Update to whatever language you prefer. Will be displayed as is.
    # Order is important
    days:
        - Sun
        - Mon
        - Tue
        - Wed
        - Thu
        - Fri
        - Sat

    # Update to whatever language you prefer. Will be displayed as is.
    # Order is important
    months:
        - Jan
        - Feb
        - Mar
        - Apr
        - May
        - Jun
        - Jul
        - Aug
        - Sep
        - Oct
        - Nov
        - Dec

    # Set to False to disable hiding cursor using CSS {cursor: none;}
    #   This is a workaround for the fact that the Raspbian's labwc does not
    #   have an easy way to hide the cursor. Setting this to True will
    #   hide the cursor while it is on the webpage.
    cssHideCursor: True
